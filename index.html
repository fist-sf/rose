const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, t0 = performance.now(), last = 0;
let bgCanvas = null;
let cut = null, cutAR = 1;

/* ---------- 抠图：去掉粉色背景 + 去掉玫瑰（只留猫） ---------- */
function cutout(img){
  const w = 420, h = Math.round(w * img.height / img.width);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  const id = x.getImageData(0, 0, w, h), p = id.data;
  const isPinkish = (q) => {
    const i = q*4, r0 = p[i], g0 = p[i+1], b0 = p[i+2];
    const isRed = (r0 > 130 && r0 - g0 > 60 && r0 - b0 > 50);
    const isGreen = (g0 > 60 && g0 - r0 > 18 && g0 - b0 > 10);
    return (r0 - g0 > 14 && b0 > 120) || isRed || isGreen;   /* 粉底 + 图里的玫瑰 一起去掉 */
  };
  /* 从四边向内做泛洪：只删"连着边缘的背景"，猫内部不会被误删 */
  const bg = new Uint8Array(w*h), st = [];
  for(let px=0; px<w; px++){ if(isPinkish(px)) st.push(px); const q=(h-1)*w+px; if(isPinkish(q)) st.push(q); }
  for(let py=0; py<h; py++){ const a=py*w; if(isPinkish(a)) st.push(a); const b2=py*w+w-1; if(isPinkish(b2)) st.push(b2); }
  while(st.length){
    const q = st.pop();
    if(bg[q]) continue;
    bg[q] = 1;
    const qx = q % w, qy = (q - qx)/w;
    if(qx > 0 && !bg[q-1] && isPinkish(q-1)) st.push(q-1);
    if(qx < w-1 && !bg[q+1] && isPinkish(q+1)) st.push(q+1);
    if(qy > 0 && !bg[q-w] && isPinkish(q-w)) st.push(q-w);
    if(qy < h-1 && !bg[q+w] && isPinkish(q+w)) st.push(q+w);
  }
  for(let q=0;q<w*h;q++){
    const i = q*4;
    if(bg[q]) p[i+3] = 0;
    else if(p[i] > 130 && p[i]-p[i+1] > 60 && p[i]-p[i+2] > 50) p[i+3] = 0;   /* 图里原有玫瑰也去掉 */
    else if(p[i+1] > 60 && p[i+1]-p[i] > 18 && p[i+1]-p[i+2] > 10) p[i+3] = 0; /* 绿叶 */
  }
  x.putImageData(id, 0, 0);
  cut = c; cutAR = w/h;
}

/* ---------- 粒子层（虚幻汇聚用，保留原图颜色） ---------- */
const PAL = [[235,245,255],[180,215,255],[120,175,255],[85,125,245],[150,115,255],[35,55,150],[95,235,255],[205,165,255],[255,255,255],[70,95,150]];
const PBUCK = PAL.map(c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')');
function nearPal(r,g,b){
  let best = 0, bd = 1e9;
  for(let i=0;i<PAL.length;i++){ const c = PAL[i];
    const d = (r-c[0])*(r-c[0]) + (g-c[1])*(g-c[1]) + (b-c[2])*(b-c[2]);
    if(d < bd){ bd = d; best = i; } }
  return best;
}
let PN = 0, phx = null, phy = null, pbk = null, psc = null, psc2 = null, builtAt = 0, imgAR2 = 1;
function buildParticles(img){
  const sw = 250, sh = Math.round(sw * img.height / img.width);
  const c = document.createElement('canvas'); c.width = sw; c.height = sh;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, sw, sh);
  const d = x.getImageData(0, 0, sw, sh).data;
  const P = [];
  for(let py=0; py<sh; py++){
    for(let px=0; px<sw; px++){
      const i = (py*sw+px)*4, r0 = d[i], g0 = d[i+1], b0 = d[i+2];
      if(r0 - g0 > 25 && b0 > 150) continue;              /* 去掉粉色背景 */
      if(r0 > 130 && r0 - g0 > 60 && r0 - b0 > 50) continue;  /* 去掉图里的玫瑰（后面用画的） */
      const lum = (r0+g0+b0)/3;
      const rate = lum < 120 ? 0.92 : (lum < 200 ? 0.40 : 0.20);   /* 深色=描边，重点采样 */
      if(Math.random() > rate) continue;
      P.push([px/sw - .5, -(py/sh - .5), nearPal(r0,g0,b0)]);
    }
  }
  PN = P.length;
  phx = new Float32Array(PN); phy = new Float32Array(PN); pbk = new Uint8Array(PN); psc = new Float32Array(PN); psc2 = new Float32Array(PN);
  for(let k=0;k<PN;k++){
    phx[k] = P[k][0]; phy[k] = P[k][1]; pbk[k] = P[k][2];
    const a = Math.random()*6.283, rr = 0.8 + Math.random()*1.1;
    psc[k] = Math.cos(a)*rr; psc2[k] = Math.sin(a)*rr*0.75 + 0.55;
  }
  imgAR2 = img.width/img.height;
  builtAt = (performance.now() - t0)/1000;
}

/* ---------- 背景：深色代码 ---------- */
function makeBg(){
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W; bgCanvas.height = H;
  const b = bgCanvas.getContext('2d');
  b.fillStyle = '#0d1117'; b.fillRect(0,0,W,H);
  b.fillStyle = '#0a0e15'; b.fillRect(0,0,Math.min(170,W*.14),H);
  b.font = '13px Consolas,monospace'; b.textBaseline = 'top';
  const CODE = ['// 送给你的小猫','const you = "the one I miss";','','class Kitten {','  constructor() { this.tail = "wag"; }','  giveRose() { return "rose"; }','}','','while (missYou) { heartbeat++; }','console.log("take my rose, and my heart");','','# 玫瑰 🌹 for you'];
  for(let i=0;i<CODE.length;i++){
    const y = 64 + i*24; if(y > H) break;
    b.fillStyle = '#2b333d'; b.textAlign='right'; b.fillText(String(i+1), Math.min(148,W*.13), y);
    b.textAlign='left';
    b.fillStyle = /^(\/\/|#)/.test(CODE[i]) ? '#41603c' : '#6f8299';
    b.fillText(CODE[i], Math.min(168,W*.15), y);
  }
}
function resize(){
  W = innerWidth; H = innerHeight;
  cv.width = W; cv.height = H; cv.style.width = W+'px'; cv.style.height = H+'px';
  makeBg();
}

let fsDone = false;
function goFull(){
  fsDone = true;
  const el = document.documentElement;
  const rq = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(rq){ try{ const pr = rq.call(el); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){} }
  const f = document.getElementById('fs'); if(f) f.style.opacity = 0;
}
function tap(){ if(!fsDone) goFull(); else { t0 = performance.now(); } }
addEventListener('click', tap);
addEventListener('touchstart', e=>{ e.preventDefault(); tap(); }, {passive:false});

const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;

/* ---------- 画尾巴（白色 + 深色描边），wag = -1..1 ---------- */
function drawTail(cx, cy, k, wag, up){
  const a = wag*0.55;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(a + (up ? -0.5 : 0));
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#242028';
  ctx.lineWidth = k*0.075 + k*0.03;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-k*0.16, -k*0.14, -k*0.05, -k*0.30); ctx.stroke();
  ctx.strokeStyle = '#f4f6fa';
  ctx.lineWidth = k*0.075;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-k*0.16, -k*0.14, -k*0.05, -k*0.30); ctx.stroke();
  /* 尾巴尖（灰） */
  ctx.fillStyle = '#cfd3d8';
  ctx.beginPath(); ctx.arc(-k*0.05, -k*0.30, k*0.045, 0, 6.283); ctx.fill();
  ctx.restore();
}

/* ---------- 画两条小腿（站立时） ---------- */
function drawLegs(cx, cy, k){
  for(const s of [-1, 1]){
    const x = cx + s*k*0.085;
    ctx.fillStyle = '#242028';
    ctx.beginPath(); ctx.ellipse(x, cy, k*0.055, k*0.085, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#f7f8fb';
    ctx.beginPath(); ctx.ellipse(x, cy - k*0.008, k*0.045, k*0.072, 0, 0, 6.283); ctx.fill();
  }
}

/* ---------- 玫瑰粒子（让玫瑰也"粒子汇聚"出来） ---------- */
let roseN = 0, rHX = null, rHY = null, rSC = null, rSC2 = null, rGC = null;
const RPAL = ['rgb(168,18,44)','rgb(214,38,64)','rgb(240,120,140)','rgb(255,236,242)','rgb(74,178,86)'];
function buildRoseParts(){
  const P = [];
  /* 螺旋花瓣（从花心往外卷） */
  for(let i=0;i<460;i++){
    const t = i/460;
    const th = t*9.2 + Math.random()*0.12;
    const rr = 0.016 + 0.104*Math.pow(t, 0.62);
    P.push([Math.cos(th)*rr + (Math.random()-.5)*0.008,
            Math.sin(th)*rr + (Math.random()-.5)*0.008,
            t < 0.42 ? 0 : (t < 0.78 ? 1 : 2)]);
  }
  /* 外圈 6 片大花瓣（弧线） */
  for(let p2=0;p2<6;p2++){
    const base = p2/6*6.283;
    for(let i=0;i<34;i++){
      const t = i/33;
      const a = base + (t-0.5)*1.05;
      const rr = 0.116 + Math.sin(t*Math.PI)*0.024;
      P.push([Math.cos(a)*rr, Math.sin(a)*rr, 2]);
    }
  }
  /* 花心高光 */
  for(let i=0;i<46;i++){
    const a = Math.random()*6.283, rr = Math.random()*0.024;
    P.push([Math.cos(a)*rr, Math.sin(a)*rr, 3]);
  }
  /* 花茎 */
  for(let i=0;i<54;i++){
    const t = i/53;
    P.push([2*(1-t)*t*0.05 + t*t*0.02 + (Math.random()-.5)*0.010,
            2*(1-t)*t*0.16 + t*t*0.30 + (Math.random()-.5)*0.010, 4]);
  }
  /* 两片叶 */
  for(let i=0;i<40;i++){
    const a = Math.random()*6.283, r2 = Math.sqrt(Math.random());
    P.push([-0.045 + Math.cos(a)*0.058*r2, 0.155 + Math.sin(a)*0.024*r2, 4]);
  }
  roseN = P.length;
  rHX = new Float32Array(roseN); rHY = new Float32Array(roseN);
  rSC = new Float32Array(roseN); rSC2 = new Float32Array(roseN); rGC = new Uint8Array(roseN);
  for(let i=0;i<roseN;i++){
    rHX[i] = P[i][0]; rHY[i] = P[i][1]; rGC[i] = P[i][2];
    const a = Math.random()*6.283, rr = 1.3 + Math.random()*1.6;
    rSC[i] = Math.cos(a)*rr; rSC2[i] = Math.sin(a)*rr*0.75 + 0.45;
  }
}

/* ---------- 画玫瑰 ---------- */
/* 一片花瓣：从花心向外 */
function petal(k, len, wid, rot, c0, c1, c2, rim){
  ctx.save();
  ctx.rotate(rot);
  const g = ctx.createLinearGradient(0, 0, len, 0);
  g.addColorStop(0, c0); g.addColorStop(0.55, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(len*0.35, -wid, len*0.95, -wid*0.85, len, -wid*0.06);
  ctx.bezierCurveTo(len*0.95, wid*0.85, len*0.35, wid, 0, 0);
  ctx.closePath(); ctx.fill();
  /* 花瓣边缘高光 */
  ctx.strokeStyle = rim; ctx.lineWidth = Math.max(0.6, k*0.0035);
  ctx.beginPath();
  ctx.moveTo(len*0.18, -wid*0.55);
  ctx.bezierCurveTo(len*0.65, -wid*0.72, len*0.92, -wid*0.5, len*0.98, -wid*0.05);
  ctx.stroke();
  ctx.restore();
}

/* 写实玫瑰：多层花瓣由内向外卷 */
function drawRose(x, y, k, rot, alpha){
  ctx.save();
  ctx.globalAlpha = (alpha === undefined ? 1 : alpha);
  ctx.translate(x, y); ctx.rotate(rot);
  /* 茎 */
  const gs = ctx.createLinearGradient(0, 0, k*0.06, k*0.34);
  gs.addColorStop(0, '#6cc476'); gs.addColorStop(0.5, '#3f8f45'); gs.addColorStop(1, '#256a2c');
  ctx.strokeStyle = gs; ctx.lineWidth = k*0.024; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(k*0.05, k*0.17, k*0.02, k*0.32); ctx.stroke();
  /* 叶（带叶脉） */
  for(const L of [[-0.050, 0.150, -0.55, 0.062, 0.026], [0.030, 0.235, 0.45, 0.052, 0.021]]){
    ctx.save(); ctx.translate(k*L[0], k*L[1]); ctx.rotate(L[2]);
    const gl = ctx.createLinearGradient(-k*L[3], 0, k*L[3], 0);
    gl.addColorStop(0, '#63c06d'); gl.addColorStop(0.5, '#3f8f45'); gl.addColorStop(1, '#24662a');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.ellipse(0, 0, k*L[3], k*L[4], 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(22,58,26,.5)'; ctx.lineWidth = k*0.004;
    ctx.beginPath(); ctx.moveTo(-k*L[3]*0.85, 0); ctx.lineTo(k*L[3]*0.85, 0); ctx.stroke();
    ctx.restore();
  }
  /* 花萼 */
  ctx.fillStyle = '#2f7a36';
  for(const a of [-2.6, -0.5, 1.6]){
    ctx.save(); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(k*0.03, -k*0.03, k*0.085, -k*0.012);
    ctx.quadraticCurveTo(k*0.03, k*0.03, 0, 0); ctx.fill();
    ctx.restore();
  }
  /* 花瓣：由外向内一层层卷 */
  const L = 5;
  for(let layer = L; layer >= 1; layer--){
    const t = layer/L;
    const n = 5 + Math.round(t*5);
    const rad = k*(0.020 + 0.098*t);
    const len = k*(0.048 + 0.062*t);
    const wid = k*(0.030 + 0.026*t);
    for(let i=0;i<n;i++){
      const a = i/n*6.283 + layer*0.72;
      const dark  = 'rgba(' + Math.round(142 + 46*(1-t)) + ',4,22,1)';
      const mid   = 'rgba(' + Math.round(218 + 30*(1-t)) + ',10,34,1)';
      const light = 'rgba(252,' + Math.round(92 + 72*(1-t)) + ',' + Math.round(112 + 70*(1-t)) + ',1)';
      petal(k, len, wid, a, dark, mid, light, 'rgba(255,190,205,.55)');
    }
  }
  /* 外层红色柔光（更亮更热烈） */
  const HG = ctx.createRadialGradient(0, 0, k*0.05, 0, 0, k*0.40);
  HG.addColorStop(0, 'rgba(255,80,120,.35)');
  HG.addColorStop(1, 'rgba(255,60,110,0)');
  ctx.fillStyle = HG;
  ctx.beginPath(); ctx.arc(0, 0, k*0.40, 0, 6.283); ctx.fill();

  /* 花心（紧密的小卷） */
  for(let i=0;i<7;i++){
    const a = i*0.9;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, k*0.042);
    g.addColorStop(0, '#ff9fb2'); g.addColorStop(0.6, '#c81f3c'); g.addColorStop(1, 'rgba(120,10,30,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(Math.cos(a)*k*0.010, Math.sin(a)*k*0.010, k*0.030, k*0.021, a, 0, 6.283); ctx.fill();
  }
  /* 整体暗边（体积感） */
  ctx.strokeStyle = 'rgba(96,6,24,.35)'; ctx.lineWidth = k*0.007;
  ctx.beginPath(); ctx.arc(0, 0, k*0.150, 0, 6.283); ctx.stroke();
  ctx.restore();
}

/* ---------- 眨眼：在眼睛位置压两条弧 ---------- */
function drawBlink(cx, cy, k){
  ctx.strokeStyle = '#1a1720'; ctx.lineWidth = k*0.016; ctx.lineCap='round';
  for(const s of [-1,1]){
    const ex = cx + s*k*0.155, ey = cy - k*0.045;
    ctx.beginPath(); ctx.arc(ex, ey, k*0.055, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
  }
}

function draw(now){
  if(now - last < 30) return;
  last = now;
  const T = ((now - t0)/1000) % 18.6;          /* 17 秒一轮 */
  const ringY = H*0.80;
  const k = Math.min(H*0.52, W*0.72);          /* 猫的基准尺寸 */
  const catH = k, catW = k*cutAR;

  ctx.setTransform(1,0,0,1,0,0);           /* 每帧重置，保证猫不会倒/翻 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bgCanvas, 0, 0);

  /* ---- 星空 ---- */
  ctx.globalCompositeOperation = 'lighter';
  if(starSprite){
    for(const st of skyStars){
      const tw = 0.35 + 0.65*Math.abs(Math.sin(T*st.sp + st.ph));
      const a = st.a*tw;
      if(a < 0.03) continue;
      const sz2 = st.s*Math.min(W,H)*(0.8 + tw*0.9);
      ctx.globalAlpha = a;
      ctx.drawImage(starSprite, st.x*W - sz2/2, st.y*H - sz2/2, sz2, sz2);
    }
    ctx.globalAlpha = 1;
  }
  /* ---- 质感流星：渐变拖尾 + 柔光头 + 星尘 ---- */
  if(!window.__meteors) window.__meteors = [];
  const MTS = window.__meteors;
  /* 流星雨：持续小流量 + 每 9 秒一波爆发 */
  if(T - (window.__lastM || -9) > 0.28 + Math.random()*0.22){
    window.__lastM = T;
    const burst = ((T % 9) < 1.6);
    const num = burst ? 3 : 1;
    for(let q3=0; q3<num; q3++){
      MTS.push({ t0: T + q3*0.05, x: 0.02 + Math.random()*0.86, y: 0.02 + Math.random()*0.30,
                 ang: 0.52 + Math.random()*0.22, len: 0.30 + Math.random()*0.34,
                 life: 1.3 + Math.random()*0.7, big: Math.random() < 0.30 });
    }
    while(MTS.length > 46) MTS.shift();
  }
  for(let mi = MTS.length - 1; mi >= 0; mi--){
    const m = MTS[mi];
    const prog = (T - m.t0)/m.life;
    if(prog < 0) continue;
    if(prog > 1){ MTS.splice(mi, 1); continue; }
    const fade = 1 - prog;
    const hx = m.x*W + Math.cos(m.ang)*m.len*W*prog;
    const hy = m.y*H + Math.sin(m.ang)*m.len*H*prog;
    const tx = hx - Math.cos(m.ang)*m.len*W*(m.big ? 1.25 : 1);
    const ty = hy - Math.sin(m.ang)*m.len*H*(m.big ? 1.25 : 1);
    const g = ctx.createLinearGradient(tx, ty, hx, hy);
    g.addColorStop(0, 'rgba(255,240,200,0)');
    g.addColorStop(0.35, 'rgba(255,242,205,' + (0.30*fade).toFixed(3) + ')');
    g.addColorStop(0.72, 'rgba(255,244,210,' + (0.68*fade).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,255,248,' + (1.0*fade).toFixed(3) + ')');
    ctx.strokeStyle = g; ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2, Math.min(W,H)*(m.big ? 0.0080 : 0.0050));
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
    const hs = Math.min(W,H)*(m.big ? 0.100 : 0.070);
    ctx.globalAlpha = fade*0.95;
    ctx.globalAlpha = fade*0.55;
    ctx.drawImage(starSprite, hx - hs*0.9, hy - hs*0.9, hs*1.8, hs*1.8);
    ctx.globalAlpha = fade*0.95;
    ctx.drawImage(starSprite, hx - hs/2, hy - hs/2, hs, hs);
    ctx.globalAlpha = 1;
    for(let q2=0;q2<5;q2++){
      const fq = (q2+1)/6;
      const X = hx - Math.cos(m.ang)*m.len*W*fq*0.9;
      const Y = hy - Math.sin(m.ang)*m.len*H*fq*0.9;
      const al = fade*fq*0.85;
      if(al < 0.03) continue;
      ctx.fillStyle = 'rgba(255,246,215,' + al.toFixed(3) + ')';
      const w2 = Math.max(1, Math.min(W,H)*0.0016*(1.2-fq));
      ctx.fillRect(X + (q2%2 ? 3 : -3), Y + (q2%2 ? -2 : 3), w2, w2);
    }
  }

  /* 底部粉色氛围光 */
  ctx.globalCompositeOperation = 'lighter';
  const g0 = ctx.createRadialGradient(W/2, ringY - H*0.22, 0, W/2, ringY - H*0.22, Math.max(W,H)*0.55);
  g0.addColorStop(0, 'rgba(80,200,255,.24)'); g0.addColorStop(1, 'rgba(80,200,255,0)');
  ctx.fillStyle = g0; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = 'rgba(190,225,255,.55)';
  for(const d of dots){
    d.y -= d.v*0.0022; if(d.y < -.02){ d.y = 1.02; d.x = Math.random(); }
    ctx.fillRect(d.x*W, d.y*H, d.s, d.s);
  }

  /* 光流：从圆台向上盘旋喷射 */
  for(const st of streams2){
    st.p += st.sp*0.010; if(st.p > 1) st.p -= 1;
    const ang = st.p*7.0 + st.a + T*0.6;
    const rr2 = (0.30 + st.p*0.55)*H*0.30;
    const X = W/2 + Math.cos(ang)*rr2;
    const Y = ringY - st.p*catH*1.15;
    ctx.fillStyle = 'rgba(150,225,255,.85)';
    ctx.fillRect(X, Y, 1.7, 1.7);
  }

  /* 粉色圆台 */
  const pulse = 1 + Math.sin(T*3.4)*.04;
  for(const [rr,col,lw] of [[0.62,'rgba(90,225,255,1)',3.4],[0.80,'rgba(140,190,255,.85)',2.2],[0.98,'rgba(200,220,255,.5)',1.3]]){
    ctx.beginPath();
    ctx.ellipse(W/2, ringY, H*0.30*rr*pulse, H*0.30*rr*pulse*0.26, 0, 0, 6.283);
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, lw*(H/700)); ctx.stroke();
  }

  /* ============ 动作时间轴 ============ */
  let cx = W/2, cy = ringY - catH*0.47, rot = 0, sc = 1, blink = false, tailWag = 0, standUp = false, roseP = -1;
  /* 猫身不再晃动 —— 只做"眨眼"和"玫瑰登场" */
  const TB = 4.0;                                   /* 4 秒后粒子汇聚完成 */
  if(T > TB){
    blink = ((T - TB) % 2.8) > 2.64;                /* 每隔 2.8 秒眨一次眼 */
  }
  /* 玫瑰：明显登场（回弹放大 + 星光迸发） */
  const TROSE = 6.2;
  if(T > TROSE){
    const q = Math.min(1, (T - TROSE)/0.85);
    const over = 1 + 0.35*Math.sin(Math.min(1,q)*Math.PI);   /* 过冲回弹 */
    roseP = q*over;
  } else {
    roseP = -1;
  }
  const imgAlpha = Math.min(0.80, Math.max(0, (Math.max(0,T-builtAt) - 3.2)/1.3));
  /* 猫身：① 粒子（虚幻汇聚） ② 清晰图淡入 */
  if(cut){
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc);
    if(PN){
      const tc = Math.max(0, T - builtAt);
      const cp = Math.min(1, tc/4.0), ce = 1 - Math.pow(1-cp,3);
      const groups = PBUCK.map(()=>[]);
      for(let q=0;q<PN;q++){
        const X = (psc[q] + (phx[q]-psc[q])*ce) * catW;
        const Y = (psc2[q] + (phy[q]-psc2[q])*ce) * catH;
        groups[pbk[q]].push([X, Y]);
      }
      ctx.globalCompositeOperation = 'lighter';
      for(let b2=0;b2<groups.length;b2++){
        const g = groups[b2]; if(!g.length) continue;
        ctx.fillStyle = PBUCK[b2];
        ctx.globalAlpha = ((b2===4||b2===6||b2===8) ? 1 : 0.92) * (imgAlpha > 0 ? (1 - 0.5*imgAlpha) : 1);
        for(let q=0;q<g.length;q++) ctx.fillRect(g[q][0]-0.75, g[q][1]-0.75, 1.5, 1.5);
      }
      ctx.globalAlpha = 1;
    }
    if(imgAlpha > 0.01){
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = imgAlpha;
      ctx.shadowColor = 'rgba(255,110,190,.95)';
      ctx.shadowBlur = Math.max(10, k*0.05);
      ctx.drawImage(cut, -catW/2, -catH/2, catW, catH);
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.globalCompositeOperation = 'lighter';
  }
  if(blink && cut) drawBlink(cx, cy + Math.sin(0)*0, k);

  /* 玫瑰登场的柔光迸发（圆润光点，不要十字形） */
  if(roseP >= 0 && starSprite){
    const bt = T - 6.2;
    if(bt < 1.1){
      const prog = bt/1.1, n = 12;
      for(let i=0;i<n;i++){
        const a = i/n*6.283 + 0.4;
        const rr3 = prog*Math.min(W,H)*0.16;
        const X = cx - catW*0.30 + Math.cos(a)*rr3;
        const Y = cy + catH*0.20 + Math.sin(a)*rr3;
        const al = (1-prog)*0.85;
        if(al < 0.03) continue;
        const sz3 = Math.min(W,H)*0.020*(1 - prog*0.35);
        ctx.globalAlpha = al;
        ctx.drawImage(starSprite, X - sz3/2, Y - sz3/2, sz3, sz3);
      }
      ctx.globalAlpha = 1;
    }
  }

  /* 玫瑰：从身后掏出来，最后吊在嘴里 */
  if(cut && roseP >= 0){
    const p = Math.min(1, roseP);
    const rx = cx + catW*(-0.46 + 0.15*p);
    const ry = cy + catH*(0.40 - 0.14*p);
    const rrot = -0.9 + 1.0*p;
    /* ① 粒子从四周汇聚成"花的形状" */
    if(roseN){
      const cp = Math.min(1, p/0.86), ce = 1 - Math.pow(1-cp,3);
      ctx.save();
      ctx.translate(rx, ry); ctx.rotate(rrot + (1-cp)*0.55);
      /* 花心柔光（浪漫感） */
      const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, k*0.22);
      gg.addColorStop(0, 'rgba(255,110,150,' + (0.30*cp).toFixed(3) + ')');
      gg.addColorStop(1, 'rgba(255,110,150,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0,0,k*0.22,0,6.283); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      for(let g2=0; g2<5; g2++){
        ctx.fillStyle = RPAL[g2];
        ctx.globalAlpha = 0.95;
        for(let q=0;q<roseN;q++){
          if(rGC[q] !== g2) continue;
          const X = (rSC[q] + (rHX[q]-rSC[q])*ce) * k * 1.28;
          const Y = (rSC2[q] + (rHY[q]-rSC2[q])*ce) * k * 1.28;
          ctx.fillRect(X-1.1, Y-1.1, 2.2, 2.2);
        }
      }
      ctx.globalAlpha = 1;
      ctx.restore();
      ctx.globalCompositeOperation = 'lighter';
    }
    /* ② 聚齐后实体花淡入 */
    const fa = Math.min(1, Math.max(0, (p-0.72)/0.30));
    if(fa > 0.01) drawRose(rx, ry, k*1.28, rrot, fa);
  }


  /* 飘落花瓣（玫瑰登场后） */
  if(roseP > 0){
    for(const pt of petals){
      pt.y -= pt.v*0.010; pt.r += 0.012;
      if(pt.y < -0.05){ pt.y = 1.05; pt.x = Math.random(); }
      const X = (pt.x + Math.sin(T*0.9 + pt.ph)*0.02)*W, Y = pt.y*H, s7 = pt.s*catH;
      ctx.save(); ctx.translate(X, Y); ctx.rotate(pt.r);
      ctx.fillStyle = 'rgba(236,58,104,.92)';
      ctx.beginPath(); ctx.ellipse(0, 0, s7, s7*0.5, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'lighter';
  }

  /* 爱心 */
  const hp = Math.min(1, Math.max(0,(T-14.8)/2.0));
  if(hp > 0){
    for(const h of hearts){
      h.y -= h.sp*0.010; if(h.y < -0.05){ h.y = 1.0; h.x = .5 + (Math.random()-.5)*.7; }
      const X = h.x*W, Y = h.y*H, s4 = h.s*catH;
      const al = hp*(1 - Math.abs(h.y-0.4))*0.9; if(al <= 0) continue;
      ctx.fillStyle = 'rgba(255,105,175,' + al.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(X, Y + s4*.8);
      ctx.bezierCurveTo(X - s4*1.5, Y - s4*.5, X - s4*.3, Y - s4*1.4, X, Y - s4*.4);
      ctx.bezierCurveTo(X + s4*.3, Y - s4*1.4, X + s4*1.5, Y - s4*.5, X, Y + s4*.8);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function loop(now){
  try { draw(now); }
  catch(e){ document.getElementById('tip').textContent = '出错: ' + e.message; }
  requestAnimationFrame(loop);
}
resize();
const im = new Image();
im.onload = function(){ cutout(this); buildParticles(this); buildRoseParts(); };
im.src = CAT_IMG;
requestAnimationFrame(loop);
</script>
