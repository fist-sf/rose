<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>送你一朵玫瑰 🌹</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f16;
    -webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
  canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh}
  #fs{position:fixed;left:0;right:0;top:0;bottom:0;z-index:8;display:flex;align-items:center;justify-content:center;
    color:#fff0f8;font:600 22px/1.6 "Microsoft YaHei",sans-serif;letter-spacing:4px;
    text-shadow:0 0 26px rgba(255,90,170,.95);background:rgba(12,3,12,.30);transition:opacity .6s;pointer-events:none}
  #tip{position:fixed;left:0;right:0;bottom:12px;text-align:center;z-index:9;color:#ffc9e4;opacity:.5;
    font:12px/1.5 "Microsoft YaHei",sans-serif;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fs">点击屏幕 · 进入全屏</div>
<div id="tip">动作版 · 再点一次 = 重播</div>


</html>
